name: Release

# Publishes to nuget.org when a GitHub Release is published.
# The release tag is the package version, e.g. "v2.0.0" or "2.0.0".
# Authentication uses nuget.org Trusted Publishing (GitHub OIDC), so no API key is stored in the repo.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack AF.Decay/AF.Decay.csproj --configuration Release --output ./artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*
